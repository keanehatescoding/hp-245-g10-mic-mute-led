# Test-only override for the HP 245 14 inch G10 (Realtek ALC236,
# codec SSID 103c:8ba4).
#
# RESULT: no existing fixup matches this machine, so NONE of these lines is
# a fix -- the fix is a new kernel quirk (see
# 0001-ALSA-hda-realtek-Add-mic-mute-LED-quirk-for-the-HP-245.patch).
#
#   * The F8 (microphone) lamp is wired to COEF 0x35 bits 2-3, which is
#     exactly what alc236_fixup_hp_coef_micmute_led() writes -- but this
#     machine's lamp is INVERTED: 1<<2 lights it, 2<<2 turns it off.
#     The only fixup that uses COEF 0x35 (ALC236_FIXUP_HP_MUTE_LED) also
#     drives the *speaker* LED from COEF 0x34 bit 5, which does nothing
#     here (the F5 lamp stays dark), so it cannot be borrowed.
#   * The F5 (speaker) lamp is on codec pin 0x1a (from the HP_Mute_LED DMI
#     string) and already works through the vendor fallback.
#
# => Recommended: do not install this file at all; leave the driver on its
#    default, which keeps the F5 lamp working:
#        sudo rm -f /etc/modprobe.d/hda-mic-led.conf
#        sudo mkinitcpio -P && sudo reboot
#
# The lines below are the aliases that were tried while diagnosing; they are
# kept documented so nobody repeats the work.  Install by uncommenting
# exactly one line (and keeping the array fan-out, see below).
#
#   103c:869d  ALC236_FIXUP_HP_MUTE_LED            mic LED on COEF 0x35:
#              F8 lamp lights while the mic is UNMUTED and goes out when
#              muted -- inverted, but it proves COEF 0x35 drives the lamp.
#   103c:8b65  ALC236_FIXUP_HP_MUTE_LED_MICMUTE_VREF   mic LED on pin 0x1a:
#              F8 stayed dark; the F5 lamp lit when the *mic* was muted,
#              which proves pin 0x1a = F5 (speaker) lamp.
#   103c:85f1  ALC236_FIXUP_HP_MUTE_LED_MICMUTE_GPIO   mic LED on GPIO: no
#              effect on F8.
#   103c:8b34  ALC236_FIXUP_HP_MUTE_LED_COEFBIT2   speaker LED only
#              (COEF 0x07 bit 0): no effect on either lamp.
#   103c:1586  speaker LED -> pin 0x19: no effect on F8.
#   103c:8497  speaker LED -> pin 0x1b: no effect on F8.
#   103c:84a6  no effect on F8.
#
# ---- IMPORTANT: why the alias must be repeated ------------------------
# `model` is an array of charp indexed by *HDA controller*, not by codec.
# snd_hda_intel hands out those indices with
# find_first_zero_bit(probed_devs, ...), i.e. in PCI probe order, and
# azx_bus_init(chip, model[dev]) only passes model[dev] to that controller.
# On this laptop the HDMI controller (03:00.1) probes first and takes
# index 0, so the ALC236 (03:00.6) is index 1 -- a bare
# `model=VVVV:DDDD` never reaches it (the kernel log then still says
# "picked fixup  for PCI SSID 103c:0000" instead of "alias SSID").
# So the alias is repeated to cover the first controller slots; the
# codecs that don't know the alias simply ignore it.

# Demonstration of the inverted lamp (F8 lit while the mic is unmuted):
# options snd-hda-intel model=103c:869d,103c:869d,103c:869d,103c:869d
